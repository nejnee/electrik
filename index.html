<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Электрик-спасатель</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--panel:#151b24;--panel2:#1c2430;--line:#2a3442;--text:#e6edf3;--muted:#8b98a8;--accent:#ffcc33;--danger:#ff4d4d;--ok:#3ddc84;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Rubik,system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:#0f141b;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px}
.logo span{color:var(--accent)}
.lvl{color:var(--muted);font-size:14px}
.stats{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-family:'JetBrains Mono',monospace;font-size:14px}
.stat.warn{color:var(--danger);border-color:#6a2626}
button{font-family:inherit;cursor:pointer}
.hbtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px}
.hbtn:hover{border-color:#4a5c74}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:14px;padding:14px;max-width:1440px;margin:0 auto}
aside{display:flex;flex-direction:column;gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.box h3{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{position:relative;display:flex;align-items:center;gap:7px;background:var(--panel2);border:1.5px solid var(--line);color:var(--text);border-radius:10px;padding:8px 8px;text-align:left;font-size:13px}
.tool .ic{font-size:18px;width:22px;text-align:center}
.tool .k{position:absolute;top:2px;right:5px;font-family:'JetBrains Mono',monospace;font-size:9px;color:#5d6a7a}
.tool.active{border-color:var(--accent);background:#2a2614}
.tdesc{font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.4;min-height:35px}
.meter{background:#0a0e13;border:2px solid #333d4a;border-radius:12px;padding:10px}
.lcd{background:#a9c48a;color:#16210c;border-radius:6px;padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;text-align:right;min-height:50px;box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.meter .mode{font-size:11px;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace}
.meter .expl{font-size:13px;margin-top:5px;line-height:1.4;min-height:36px}
.goals{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:5px}
.goals li{display:flex;gap:7px}
.goals li .m{width:16px;flex:none}
.goals li.ok{color:var(--ok)}
.board{background:radial-gradient(ellipse at top,#172231,#0d1117 75%);border:1px solid var(--line);border-radius:16px;overflow:hidden}
svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.under{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-top:12px}
.boxp{font-size:13.5px;line-height:1.45}
.boxp .bad,.bad{color:#ff8a8a}
.steps{margin:7px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.steps li{color:var(--muted)}
.steps li.cur{color:var(--accent);font-weight:600}
.steps li.ok{color:var(--ok)}
.log{font-size:13.5px;color:var(--muted);min-height:48px;display:flex;flex-direction:column;gap:3px;margin-top:10px;padding:0 4px}
.log .new{color:var(--text)}
.log .bad{color:#ff8a8a}
.log .good{color:var(--ok)}
.hint-btn{width:100%}
.ov{position:fixed;inset:0;background:rgba(5,8,12,.8);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.ov.hidden{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:860px;width:100%;padding:24px 26px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{margin:0 0 6px;font-size:30px}
.card h2{margin:0 0 4px;font-size:23px}
.card .sub{color:var(--muted);margin-bottom:10px}
.card p{line-height:1.5;margin:8px 0}
.lesson{background:#1a2230;border-left:4px solid var(--accent);border-radius:8px;padding:11px 14px;margin:12px 0;line-height:1.55;font-size:14.5px}
.lesson b{color:var(--accent)}
.big{background:var(--accent);color:#1b1500;border:none;border-radius:12px;padding:12px 22px;font-size:16px;font-weight:700}
.big:hover{filter:brightness(1.08)}
.big.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:14px}
.lvbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;text-align:left}
.lvbtn:hover{border-color:var(--accent)}
.lvbtn b{display:block;font-size:15px;margin-bottom:3px}
.lvbtn span{font-size:12px;color:var(--muted)}
.lvbtn.done{border-color:#2f6a45}
.lvbtn.done b::after{content:" ✓";color:var(--ok)}
.flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;transition:opacity .3s}
.cheat dt{font-weight:700;color:var(--accent);margin-top:12px}
.cheat dd{margin:3px 0 0;line-height:1.5;color:#cfd8e3}
.hit,.nodec,.clk{cursor:pointer}
.smoke circle{transform-box:fill-box;transform-origin:center;animation:smoke 1.5s ease-out infinite}
.smoke circle:nth-child(2){animation-delay:.5s}
.smoke circle:nth-child(3){animation-delay:1s}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:.85}100%{transform:translateY(-34px) scale(1.8);opacity:0}}
@media (max-width:880px){.wrap{grid-template-columns:1fr}aside{order:2}.under{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">⚡ Электрик-<span>спасатель</span></div>
  <div class="lvl" id="lvlName"></div>
  <div class="stats">
    <div class="stat" id="timer">⏱ 0:00</div>
    <div class="stat" id="lives">❤️❤️❤️</div>
    <div class="stat" id="score">★ 0</div>
    <button class="hbtn" id="helpBtn">📘 Справка</button>
    <button class="hbtn" id="menuBtn">☰ Уровни</button>
  </div>
</header>

<div class="wrap">
  <aside>
    <div class="box">
      <h3>Инструменты</h3>
      <div class="tools" id="tools"></div>
      <div class="tdesc" id="tdesc"></div>
    </div>
    <div class="box">
      <h3>Мультиметр</h3>
      <div class="meter">
        <div class="lcd" id="lcd">—</div>
        <div class="mode" id="lcdMode">&nbsp;</div>
        <div class="expl" id="lcdExpl">Выбери инструмент и щёлкни по схеме.</div>
      </div>
    </div>
    <button class="hbtn hint-btn" id="hintBtn">💡 Подсказка (−10 с)</button>
  </aside>
  <main>
    <div class="board" id="board"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="under">
      <div class="box"><h3>Распаечная коробка</h3><div class="boxp" id="boxp"></div></div>
      <div class="box"><h3>Задача</h3><ul class="goals" id="goals"></ul></div>
    </div>
    <div class="log" id="log"></div>
  </main>
</div>

<div class="ov" id="ov"><div class="card" id="card"></div></div>
<div class="flash" id="flash"></div>

<script>
// ===== Физика =====
const E=230, RINT=0.25, RSEG=0.15, RLOOSE=0.9, RSHORT=0.05, IMAX=16, ITRIP=63;
const LT={
  lamp:{n:'Лампа',ic:'💡',P:60},
  tv:{n:'Телевизор',ic:'📺',P:120},
  fridge:{n:'Холодильник',ic:'🧊',P:150},
  kettle:{n:'Чайник',ic:'🫖',P:2000},
  heater:{n:'Обогреватель',ic:'♨️',P:2000},
  micro:{n:'Микроволновка',ic:'🍿',P:1200},
  pc:{n:'Компьютер',ic:'💻',P:300},
  washer:{n:'Стиралка',ic:'🧺',P:2000},
  fen:{n:'Фен',ic:'💨',P:1200},
};
const TOOLS=[
 {id:'volt',ic:'🔍',n:'Мультиметр',d:'Автомат включён — меряет напряжение. Выключен — сопротивление («прозвонка»). Щёлкай по точкам и коробкам.'},
 {id:'amp',ic:'🧲',n:'Клещи',d:'Токоизмерительные клещи: ток в кабеле. Щёлкай по проводу между коробками.'},
 {id:'drill',ic:'🔩',n:'Шуруповёрт',d:'Снять или поставить крышку распаечной коробки.'},
 {id:'screw',ic:'🪛',n:'Отвёртка',d:'Ослабить или затянуть винт клеммы.'},
 {id:'cut',ic:'✂️',n:'Кусачки',d:'Откусить обгоревшие или оплавленные концы проводов.'},
 {id:'pliers',ic:'🗜️',n:'Плоскогубцы',d:'Скрутить провода. В исправной коробке — разъединить или соединить скрутку (для прозвонки).'},
 {id:'brush',ic:'🧹',n:'Щётка',d:'Очистить контакты от окислов, копоти и нагара.'},
 {id:'tape',ic:'🩹',n:'Изолента',d:'Заизолировать скрутку, чтобы провода не касались друг друга.'},
];
const TI={}; TOOLS.forEach(t=>TI[t.id]=t);
const PROCS={
 break:{desc:'Скрутка перегорела, провода разошлись — это обрыв.',
   steps:[['cut','откусить обгоревшие концы',1.0],['pliers','скрутить провода заново',1.4],['tape','заизолировать скрутку',1.2]]},
 short:{desc:'Изоляция оплавилась, фаза коснулась нуля — короткое замыкание. Всё в копоти.',
   steps:[['cut','вырезать оплавленные концы',1.0],['brush','очистить копоть и нагар',1.4],['pliers','скрутить провода заново',1.4],['tape','заизолировать каждую скрутку',1.2]]},
 loose:{desc:'Винт клеммы разболтался, контакт окислился и почернел — плохой контакт.',
   steps:[['screw','ослабить винт клеммы',1.0],['brush','зачистить окислы до блеска',1.4],['screw','плотно затянуть винт',1.0]]},
};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

const LEVELS=[
{title:'Тёмная спальня',tag:'Обрыв провода',time:120,
 story:'23:40, звонок: «В спальне не горит свет и не работает телевизор!» Похоже, где-то перегорела скрутка.',
 lesson:`<b>Напряжение</b> похоже на давление воды в трубе: от щитка в провод «давит» 230 вольт (В). Если провод <b>оборван</b>, за обрывом давления нет, и мультиметр покажет <b>0 В</b>.<br><br>Квадратики на линии — это <b>распаечные коробки</b>. В них провода соединены скрутками, и ломается чаще всего именно там.<br><br>🔍 Мультиметром щёлкай по коробкам слева направо. Неисправна <b>первая коробка, где 0 В</b>.<br><br><b>Ремонт:</b> ⚠️ выключи автомат на щитке → 🔩 сними крышку → ✂️ откуси обгоревшее → 🗜️ скрути → 🩹 заизолируй → 🔩 закрой крышку → включи автомат.`,
 recap:'Обрыв находят по напряжению: до него оно есть, после — ноль. Ремонт в коробке делают только при выключенном автомате.',
 make:()=>[{room:'Спальня',n:4,loads:[['lamp',2,1],['tv',4,1]],fault:{type:'break',seg:rnd(0,3)}}]},

{title:'Искры на кухне',tag:'Короткое замыкание',time:150,
 story:'На кухне что-то хлопнуло, запахло гарью, и автомат выбило. Свет на кухне погас.',
 lesson:`<b>Короткое замыкание (КЗ)</b>: изоляция оплавилась, и фаза коснулась нуля. Ток пошёл в обход приборов, поэтому он <b>огромный</b>. Автомат выключился, чтобы спасти проводку.<br>⚠️ <b>Не включай автомат, пока не починишь</b>: каждое включение раскаляет провода, и на втором будет пожар.<br><br>Место КЗ ищут <b>прозвонкой</b>. При выключенном автомате мультиметр меряет <b>сопротивление</b>:<br>• щёлкни в начале линии: около <b>0 Ом</b> означает, что КЗ есть;<br>• сними крышку средней коробки 🔩 и разъедини скрутку 🗜️ — так ты отрежешь дальнюю часть линии;<br>• измерь снова в начале линии. Если всё ещё 0 Ом, КЗ до этой коробки, если нет — после.<br><br><b>Ремонт:</b> ✂️ вырезать оплавленное → 🧹 очистить копоть → 🗜️ скрутить → 🩹 заизолировать. Потом соедини разъединённую скрутку 🗜️, закрой все крышки 🔩 и включи автомат.`,
 recap:'При КЗ ток идёт «коротким путём» мимо приборов. Место находят прозвонкой: делят линию пополам и меряют сопротивление.',
 make:()=>[{room:'Коридор',n:3,loads:[['lamp',3,1]]},
           {room:'Кухня',n:5,loads:[['lamp',1,1],['fridge',3,1],['kettle',5,0,0]],fault:{type:'short',seg:rnd(1,3)},tripped:true}]},

{title:'Все включили сразу',tag:'Перегрузка',time:100,
 story:'К соседям пришли гости. На кухне одновременно работают чайник, обогреватель и микроволновка, и запахло горячей изоляцией.',
 lesson:`<b>Ток</b> — это сколько электричества течёт по проводу. Его меряют в амперах (А). Каждый прибор берёт свой ток: <b>мощность = напряжение × ток</b>. Чайнику на 2000 Вт нужно около 9 А.<br><br>Провод в доме рассчитан на <b>16 А</b>. Если ток больше, провод <b>греется</b>, а старые пробки в этом доме на перегрузку не реагируют. Первый признак — запах и дымок.<br><br>🧲 <b>Клещами</b> измерь ток в кабеле. Выключи лишние приборы кнопкой рядом с ними. Приборы со звёздочкой ★ жильцам нужны, их оставь.`,
 recap:'Токи всех включённых приборов складываются. Больше 16 А провод не выдерживает, поэтому мощные приборы не включают вместе на одной линии.',
 make:()=>[{room:'Кухня',n:5,loads:[['lamp',1,1],['kettle',2,1],['heater',3,0],['micro',4,0],['fridge',5,1]],preheat:30},
           {room:'Комната',n:3,loads:[['lamp',2,1],['pc',3,0]]}]},

{title:'Мигающий свет',tag:'Плохой контакт',time:150,
 story:'«В гостиной мигает свет, а из коробки над дверью пахнет пластиком». Где-то ослаб контакт.',
 lesson:`<b>Сопротивление</b> — это то, насколько провод мешает току. У хорошего контакта оно крошечное. Если винт клеммы ослаб и контакт окислился, сопротивление растёт: здесь <b>теряется напряжение и выделяется тепло</b>. Свет мигает, а контакт может расплавиться.<br><br>🔍 Измерь мультиметром две соседние точки. На исправном участке напряжение падает примерно на 1 В, а перед плохой коробкой — на несколько вольт.<br>💡 Если греется слишком быстро, выключи мощный прибор: меньше ток — меньше нагрев.<br><br><b>Ремонт:</b> выключи автомат → 🔩 крышка → 🪛 ослабить винт → 🧹 зачистить окислы → 🪛 затянуть → 🔩 закрыть.`,
 recap:'Нагрев зависит и от тока, и от сопротивления. Разболтанный, окисленный контакт — частая причина пожаров в старых домах.',
 make:()=>[{room:'Коридор',n:3,loads:[['lamp',2,1]]},
           {room:'Гостиная',n:5,loads:[['lamp',1,1],['tv',3,1],['heater',5,1]],fault:{type:'loose',seg:rnd(0,3)}},
           {room:'Детская',n:4,loads:[['lamp',2,1],['pc',4,0]]}]},

{title:'Ночная смена',tag:'Всё сразу',time:270,
 story:'Худшая ночь в доме: обрыв, замыкание, перегрузка и плохой контакт одновременно. Первым делом займись тем, что греется!',
 lesson:`Тут пригодится всё, что ты уже знаешь:<br>• <b>Обрыв</b>: после неисправной коробки 0 В.<br>• <b>КЗ</b>: автомат выбило, ищи прозвонкой.<br>• <b>Перегрузка</b>: ток больше 16 А, выключи лишнее.<br>• <b>Плохой контакт</b>: большое падение напряжения и дымок.<br><br>Расставь приоритеты: то, что может загореться, — первым делом. И не забывай выключать автомат перед ремонтом.`,
 recap:'Ты прошёл полную смену электрика! Обрыв, КЗ, перегрузка и плохой контакт — главные неисправности домашней проводки.',
 make:()=>[{room:'Спальня',n:4,loads:[['lamp',2,1],['tv',4,1]],fault:{type:'break',seg:rnd(0,3)}},
           {room:'Кухня',n:5,loads:[['lamp',1,1],['kettle',2,1],['heater',3,0],['micro',4,0],['fridge',5,1]],preheat:15},
           {room:'Ванная',n:4,loads:[['lamp',1,1],['washer',3,1],['fen',4,0,0]],fault:{type:'short',seg:rnd(1,2)},tripped:true},
           {room:'Гостиная',n:4,loads:[['lamp',1,1],['tv',2,1],['heater',4,1]],fault:{type:'loose',seg:rnd(0,3)}}]},
];

const G={state:'menu',br:[],tool:'volt',score:0,marks:[],logs:[],done:loadDone(),busy:null,sel:null};
function loadDone(){try{return JSON.parse(localStorage.getItem('elec_done')||'[]')}catch(e){return []}}
function saveDone(){try{localStorage.setItem('elec_done',JSON.stringify(G.done))}catch(e){}}

const segR=s=>s.loose?RLOOSE:RSEG;
const isOpen=s=>s.open||s.disc;

function buildBranch(d){
  const b={room:d.room,n:d.n,breaker:!d.tripped,segs:[],box:[null],loads:[],V:[],Iseg:[],path:[],gsh:[],I:0,Rin:Infinity,tripFlash:0,noff:0};
  for(let k=0;k<d.n;k++) b.segs.push({open:false,short:false,loose:false,disc:false,heat:d.preheat||0,off:0});
  for(let k=1;k<=d.n;k++) b.box.push({open:false,proc:null});
  d.loads.forEach(([t,node,req,on])=>b.loads.push({t,node,req:!!req,on:on===undefined?true:!!on,R:E*E/LT[t].P,V:0,I:0}));
  if(d.fault){
    const s=b.segs[d.fault.seg];
    if(d.fault.type==='break') s.open=true; else s[d.fault.type]=true;
    if(d.fault.type==='short'){ for(let k=0;k<=d.fault.seg;k++) b.segs[k].heat=42; s.heat=58; }
  }
  return b;
}
// неисправность коробки k хранится в кабеле перед ней (segs[k-1])
function boxFault(b,k){const s=b.segs[k-1];return s.open?'break':s.short?'short':s.loose?'loose':null;}
const boxLive=(b,k)=>Math.max(b.V[k-1]||0,b.V[k]||0)>50;

function solve(){
  for(const b of G.br){
    const n=b.n, gsh=new Array(n+1).fill(0);
    for(const L of b.loads) if(L.on) gsh[L.node]+=1/L.R;
    for(let k=0;k<n;k++) if(b.segs[k].short) gsh[k+1]+=1/RSHORT;
    b.gsh=gsh;
    const Rd=new Array(n+1);
    Rd[n]=gsh[n]>0?1/gsh[n]:Infinity;
    for(let k=n-1;k>=0;k--){
      const s=b.segs[k];
      const p=isOpen(s)?Infinity:segR(s)+Rd[k+1];
      b.path[k]=p;
      const g=(p===Infinity?0:1/p)+gsh[k];
      Rd[k]=g>0?1/g:Infinity;
    }
    b.Rin=b.breaker?Rd[0]:Infinity;
  }
  let Gt=0; for(const b of G.br) if(b.Rin<Infinity) Gt+=1/b.Rin;
  G.Vbus=E/(1+RINT*Gt);
  for(const b of G.br){
    b.V[0]=b.breaker?G.Vbus:0;
    for(let k=0;k<b.n;k++){
      const s=b.segs[k], p=b.path[k];
      const I=p===Infinity?0:b.V[k]/p;
      b.Iseg[k]=I;
      b.V[k+1]=isOpen(s)?0:b.V[k]-I*segR(s);
    }
    for(const L of b.loads){L.V=L.on?b.V[L.node]:0; L.I=L.on?L.V/L.R:0;}
    b.I=b.Iseg[0]||0;
  }
}
// сопротивление между фазой и нулём в точке k при выключенном автомате
function ohm(b,k){
  const g=b.gsh; let Rl=Infinity;
  const par=(R,gg)=>{const t=(R===Infinity?0:1/R)+gg;return t>0?1/t:Infinity;};
  for(let j=1;j<=k;j++){const s=b.segs[j-1]; Rl=isOpen(s)?Infinity:segR(s)+par(Rl,g[j-1]);}
  const Rr=k<b.n?b.path[k]:Infinity;
  const t=(Rl===Infinity?0:1/Rl)+g[k]+(Rr===Infinity?0:1/Rr);
  return t>0?1/t:Infinity;
}

// ===== Игровой цикл =====
function tick(dt){
  solve();
  let tripped=false;
  for(const b of G.br){
    if(b.breaker && b.I>ITRIP){
      for(let k=0;k<b.n;k++) if(b.Iseg[k]>ITRIP) b.segs[k].heat+=22+(b.segs[k].short?10:0);
      b.breaker=false; b.tripFlash=1.2; tripped=true;
      log(`💥 Автомат «${b.room}» выбило! Ток был ${b.I.toFixed(0)} А — это короткое замыкание.`,'bad');
      sfx('trip'); flash('rgba(255,220,120,.35)'); clearMarks();
    }
  }
  if(tripped) solve();
  for(const b of G.br){
    b.segs.forEach((s,k)=>{
      const I=b.Iseg[k]||0;
      const target=60*(I/IMAX)**2*(segR(s)/RSEG);
      const rate=target>s.heat?0.03:0.012;
      s.heat+=(target-s.heat)*Math.min(1,rate*dt);
      if(s.heat>65 && !G.warned[b.room+k]){G.warned[b.room+k]=1; log(`👃 Пахнет горячей изоляцией: кабель на линии «${b.room}» перегревается!`,'bad');}
      if(s.heat>=100 && G.state==='play') lose('fire',b,k);
    });
  }
  if(G.state!=='play') return;
  if(G.busy){
    const a=G.busy, b=G.br[a.bi];
    if(a.tool!=='drill' && boxLive(b,a.k)){ G.busy=null; shock(b); }
    else { a.t+=dt; if(a.t>=a.dur){ G.busy=null; a.fn(); } }
  }
  if(G.state!=='play') return;
  G.t-=dt;
  if(G.t<=0){G.t=0; lose('time'); return;}
  const g=goals();
  if(!G.busy && g.every(x=>x.ok)){ G.winT+=dt; if(G.winT>1.2) win(); } else G.winT=0;
}

function goals(){
  const out=[];
  out.push({t:'Все автоматы включены',ok:G.br.every(b=>b.breaker)});
  for(const b of G.br) for(const L of b.loads) if(L.req)
    out.push({t:`${LT[L.t].ic} ${LT[L.t].n} — ${b.room}`,ok:L.on&&L.V>195});
  out.push({t:'Ток в каждой линии ≤ 16 А',ok:G.br.every(b=>b.I<=IMAX+0.3)});
  out.push({t:'Скрытые неисправности устранены',ok:!G.br.some(b=>b.segs.some(s=>s.open||s.short||s.loose))});
  out.push({t:'Крышки закрыты, скрутки соединены',ok:G.br.every(b=>b.box.every(x=>!x||!x.open)&&b.segs.every(s=>!s.disc))});
  return out;
}

function act(bi,k,tool,dur,label,fn){G.busy={bi,k,tool,t:0,dur,fn};log(label);sfx('work');}

function boxClick(bi,k){
  const b=G.br[bi], bx=b.box[k], t=G.tool;
  G.sel={bi,k}; hudT=0;
  if(t==='volt'){measureNode(bi,k);return;}
  if(t==='amp'){setMeter('—','','Клещи надевают на кабель — щёлкни по проводу между коробками.');return;}
  if(G.busy){log('Руки заняты — дождись конца текущей операции.');return;}
  if(t==='drill'){
    if(!bx.open) act(bi,k,t,1.5,`🔩 Откручиваю крышку коробки ${k} («${b.room}»)…`,()=>{bx.open=true;reveal(b,k);});
    else act(bi,k,t,1.2,`🔩 Прикручиваю крышку коробки ${k} на место…`,()=>{bx.open=false;log(`Коробка ${k} («${b.room}») закрыта.`);});
    return;
  }
  if(!bx.open){log('Сначала открути крышку коробки шуруповёртом 🔩.');return;}
  if(boxLive(b,k)){shock(b);return;}
  const p=bx.proc;
  if(p && p.i<PROCS[p.type].steps.length){
    const st=PROCS[p.type].steps;
    const [need,text,dur]=st[p.i];
    if(t===need) act(bi,k,t,dur,`${TI[t].ic} ${TI[t].n}: ${text}…`,()=>{p.i++; sfx('fix'); if(p.i>=st.length) fixFault(b,k);});
    else log(`Не тот инструмент. Сейчас нужно: ${TI[need].ic} ${TI[need].n} — ${text}.`,'bad');
    return;
  }
  if(t==='pliers'){
    if(k>=b.n){log('Это последняя коробка на линии — дальше разъединять нечего.');return;}
    const s=b.segs[k];
    act(bi,k,t,1.2,s.disc?`🗜️ Соединяю скрутку в коробке ${k}…`:`🗜️ Разъединяю скрутку в коробке ${k}…`,()=>{
      s.disc=!s.disc; clearMarks();
      log(s.disc?`Скрутка в коробке ${k} разъединена: дальняя часть линии отрезана.`:`Скрутка в коробке ${k} снова соединена.`);
    });
    return;
  }
  log('Здесь всё исправно — этот инструмент сейчас не нужен.');
}
function reveal(b,k){
  const bx=b.box[k], f=boxFault(b,k);
  if(bx.proc && bx.proc.i>=PROCS[bx.proc.type].steps.length){log(`Коробка ${k}: ремонт уже сделан.`);return;}
  if(f){ if(!bx.proc) bx.proc={type:f,i:0}; log(`⚠️ Коробка ${k} («${b.room}»): ${PROCS[f].desc}`,'bad'); sfx('found'); }
  else log(`Коробка ${k} («${b.room}»): внутри всё в порядке, скрутки целые.`);
}
function fixFault(b,k){
  const s=b.segs[k-1];
  s.open=s.short=s.loose=false; s.heat=Math.min(s.heat,8);
  log(`✅ Коробка ${k} («${b.room}») отремонтирована! Не забудь закрыть крышку.`,'good');
  clearMarks();
}
function shock(b){
  G.lives--; flash('rgba(190,225,255,.75)'); sfx('zap');
  log(`⚡ Удар током! Провода на линии «${b.room}» под напряжением. Сначала выключи автомат!`,'bad');
  if(G.lives<=0) lose('shock');
}

const rgb=c=>`rgb(${c.map(Math.round).join(',')})`;
function copperColor(h){const u=Math.max(0,Math.min(1,(h-55)/45));const a=[200,121,74],b=[255,59,42];return rgb(a.map((c,j)=>c+(b[j]-c)*u));}

function render(dt){
  if(!R.built) return;
  R.busV.textContent=G.Vbus.toFixed(0)+' В';
  G.br.forEach((b,i)=>{
    const r=R.rows[i], y=r.y;

    r.lever.setAttribute('y',b.breaker?y-16:y+2);
    r.lever.setAttribute('fill',b.breaker?'#3ddc84':'#ff6b6b');
    const flicker=b.segs.some((s,k)=>s.loose&&b.Iseg[k]>1);
    b.segs.forEach((s,k)=>{
      const sr=r.segs[k], I=b.Iseg[k]||0;

// ===== Измерения =====
const fV=v=>v.toFixed(1)+' В', fA=a=>a.toFixed(1)+' А';
const fO=r=>r===Infinity?'OL':r<10?r.toFixed(2)+' Ом':r.toFixed(0)+' Ом';
function setMeter(v,mode,expl){lcd.textContent=v;lcdMode.textContent=mode||' ';lcdExpl.innerHTML=expl||'';}

function measureNode(bi,k){
  const b=G.br[bi], where=k===0?'начало линии':'коробка '+k;
  if(!b.breaker){
    const r=ohm(b,k);
    let ex;
    if(r<2) ex='Почти <b>0 Ом</b> — фаза замкнута на ноль: <b>короткое замыкание</b> в подключённой части линии! Разъедини скрутку в коробке 🗜️ и измерь снова, чтобы сузить поиск.';
    else if(r===Infinity) ex='OL — цепь разомкнута: приборы выключены, провод оборван или скрутка разъединена. Замыкания нет.';
    else ex='Нормальное сопротивление — так «звонятся» включённые приборы. Замыкания в этой части линии нет.';
    setMeter(fO(r),'СОПРОТИВЛЕНИЕ (прозвонка) · '+where+' · '+b.room,ex);
    addMark(`n${bi}-${k}`,xNode(b,k),R.rows[bi].y-26,r===Infinity?'OL':r<10?r.toFixed(1)+'Ω':r.toFixed(0)+'Ω',r<2?'#ffb08a':'#c6d7f0');
    sfx('beep'); return;
  }
  const V=b.V[k];
  let ex;
  if(V>200) ex='Напряжение есть: сюда электричество доходит нормально.';
  else if(V>120) ex='Напряжение просело! Где-то очень большая нагрузка.';
  else if(V>5) ex='Очень низкое напряжение — что-то серьёзно не так.';
  else ex='0 В: сюда напряжение не доходит. Неисправна первая коробка, где оно пропало.';
  for(const nb of [k-1,k+1]){
    if(nb<0||nb>b.n||!G.marks.find(m=>m.key===`n${bi}-${nb}`)) continue;
    const a=Math.min(k,nb), c=Math.max(k,nb), d=Math.abs(b.V[a]-b.V[c]);
    if(b.V[c]<1 && b.V[a]>100) ex+=`<br>📍 Между точками ${a} и ${c} напряжение пропадает — <b>проверь коробку ${c}!</b>`;
    else ex+=`<br>Падение на участке ${a}–${c}: <b>${d.toFixed(1)} В</b> ${d>4?`— подозрительно много! Плохой контакт в коробке ${c}?`:'(норма — около 1–3 В)'}`;
  }
  setMeter(fV(V),'НАПРЯЖЕНИЕ · '+where+' · '+b.room,ex);
  addMark(`n${bi}-${k}`,xNode(b,k),R.rows[bi].y-26,V.toFixed(V<10?1:0)+'В');
  sfx('beep');
}
function measureSeg(bi,k){
  const b=G.br[bi], I=b.Iseg[k]||0, x=(xNode(b,k)+xNode(b,k+1))/2;
  let ex=I<0.05?'Ток не течёт: цепь разорвана или выключена.':I<=IMAX?'Ток в норме (провод рассчитан на 16 А).':`Больше нормы в 16 А! Провод будет <b>нагреваться</b>.`;
  setMeter(fA(I),'ТОК · кабель '+k+'–'+(k+1)+' · '+b.room,ex);
  addMark(`s${bi}-${k}`,x,R.rows[bi].y+22,I.toFixed(1)+'А',I>IMAX?'#ffb08a':'#a9d3e8');
  sfx('beep');
}
function measureLoad(bi,li,mode){
  const b=G.br[bi], L=b.loads[li], lt=LT[L.t];
  if(mode==='volt'){
    const V=b.V[L.node];
    setMeter(fV(V),'НАПРЯЖЕНИЕ · '+lt.n,V>195?'В розетке нормальное напряжение.':V>5?'Напряжение слишком низкое — прибор плохо работает.':'В розетке нет напряжения.');
  } else {
    const P=L.V*L.I;
    setMeter(fA(L.I),'ТОК · '+lt.n,L.on?`Мощность = напряжение × ток = ${L.V.toFixed(0)} × ${L.I.toFixed(1)} ≈ <b>${P.toFixed(0)} Вт</b>`:'Прибор выключен — ток не потребляет.');
  }
  sfx('beep');
}

function boxPanel(){

// ===== Звук =====
let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function tone(f,d,type,v,slide,delay){
  const a=ac(); if(!a) return;
  try{
    const t0=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+d);
    g.gain.setValueAtTime(v||.06,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+d+.02);
  }catch(e){}
}
function sfx(n){
  if(n==='click') tone(700,.05,'square',.025);
  else if(n==='beep') tone(1300,.06,'sine',.05);
  else if(n==='work'){tone(180,.25,'sawtooth',.02,260);}
  else if(n==='found'){tone(440,.12,'triangle',.06);tone(330,.18,'triangle',.06,null,.12);}
  else if(n==='zap'){tone(140,.4,'sawtooth',.1,40);tone(2200,.2,'square',.04,300);}
  else if(n==='trip'){tone(220,.25,'square',.08,60);}
  else if(n==='fix'){tone(660,.1,'sine',.06);tone(990,.15,'sine',.06,null,.1);}
  else if(n==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.07,null,i*.12));}
}

// ===== Запуск =====
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(G.state==='play') tick(dt);
  else if(G.br.length) solve();
  render(dt); hud(dt);
  requestAnimationFrame(loop);
}
G.li=0; G.br=LEVELS[0].make().map(buildBranch); buildSVG(); buildTools(); solve();
menu();
requestAnimationFrame(loop);
</script>
